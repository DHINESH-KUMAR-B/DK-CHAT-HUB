<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DK chat hub</title>
  <link rel="icon" href="image/dklogo.png">
  <link rel="stylesheet" href="css/events.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>
<body id="all">
  <h2 id="page-title">Events</h2>

  <!-- Events List -->
  <div id="events-list">
    <!-- Events will load dynamically -->
  </div>

  <!-- Floating Add Button -->
  <button id="add-event-btn"><i class="bi bi-plus-lg"></i></button>

  <!-- Popup Form -->
  <div id="event-popup">
    <div class="popup-box">
      <h3>Create Event</h3>
      <input type="text" id="event-title" placeholder="Event Title">
      <input type="date" id="event-date">
      <input type="time" id="event-time">
      <textarea id="event-desc" placeholder="Event Description"></textarea>
      <input type="text" id="poll-question" placeholder="Poll question (optional)">
      <div id="poll-options">
        <input type="text" class="poll-option-input" placeholder="Poll option 1">
        <input type="text" class="poll-option-input" placeholder="Poll option 2">
      </div>
      <button id="add-poll-option" type="button">Add option</button>
      <button id="save-event">Save</button>
      <button id="close-popup">Cancel</button>
    </div>
  </div>

  <!-- Footer Navigation -->
  <div class="footnav">
    <a href="home.html"><i class="bi bi-house"></i></a>
    <a href="chat.html"><i class="bi bi-chat"></i></a>
    <a href="group.html"><i class="bi bi-people"></i></a>
    <a href="profile.html"><i class="bi bi-person"></i></a>
  </div>

  <script type="module" src="js/event.js"></script>
</body>
</html>
