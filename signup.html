<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DK chat hub</title>
  <link rel="icon" href="image/dklogo.png">
  <link rel="stylesheet" href="css/signup.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>
<body>
  <img src="image/index page logo.png" alt="DK Friends Hub Logo">
  <div id="welcome">
    <h2>Create Account</h2>
    <p class="text">Sign up to connect</p>
  </div>

  <i id="person" class="bi bi-person"></i>
  <input type="email" id="username" placeholder="Email">

  <i id="lock" class="bi bi-lock"></i>
  <input type="password" id="password" placeholder="Password">
  <i id="toggleEye" class="bi bi-eye"></i>

  <button id="login">Sign Up</button>
  <div id="signup">Already have an account? <a id="link" href="login.html">Login</a></div>

  <script type="module" src="js/signup.js"></script>
</body>
</html>
