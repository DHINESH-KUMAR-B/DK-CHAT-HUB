<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DK chat hub</title>
  <link rel="icon" href="image/dklogo.png">
  <link rel="stylesheet" href="css/groupchat.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>
<body id="all">

  <!-- Group Header -->
  <div id="chat-header">
    <img id="group-photo" src="image/dp for groups.webp" alt="Group">
    <div>
      <div id="group-name">Group Name</div>
      <div id="group-status">Members: ...</div>
    </div>
    <button id="settings-btn">⚙️</button>
  </div>

  <!-- Chat Messages -->
  <div id="chat-box"></div>
  <div id="history-tools">
    <input id="history-search" type="search" placeholder="Search group messages...">
    <input id="history-date" type="date" aria-label="Filter messages by date">
    <button id="activity-btn" type="button"><i class="bi bi-clock-history"></i> Activity</button>
  </div>

  <!-- Input Area -->
  <div id="chat-input-area">
    <button id="emoji-btn" type="button" aria-label="Add emoji"><i class="bi bi-emoji-smile"></i></button>
    <label id="image-btn" for="image-input" aria-label="Send image"><i class="bi bi-paperclip"></i></label>
    <input type="file" id="image-input" accept="image/*" hidden>
    <input type="text" id="chat-input" placeholder="Type a message...">
    <button id="send-btn">Send</button>
  </div>
  <div id="emoji-picker" hidden>
    <button type="button">😀</button><button type="button">😂</button><button type="button">😍</button>
    <button type="button">😎</button><button type="button">😢</button><button type="button">😡</button>
    <button type="button">👍</button><button type="button">❤️</button><button type="button">🎉</button>
    <button type="button">🙏</button><button type="button">👋</button>
  </div>

  <!-- Footer Navigation -->
  <div class="footnav">
    <a href="home.html" aria-label="Home"><i class="bi bi-house"></i></a>
    <a href="chat.html" aria-label="Chats"><i class="bi bi-chat"></i></a>
    <a href="group.html" aria-label="Groups"><i class="bi bi-people"></i></a>
    <a href="profile.html" aria-label="Profile"><i class="bi bi-person"></i></a>
  </div>

  <!-- Settings Popup -->
  <div id="group-settings-popup">
    <div class="popup-box">
      <h3>Manage Members</h3>
      <input id="group-rename-input" type="text" placeholder="Group name">
      <input id="group-photo-manage" type="file" accept="image/*">
      <div id="settings-members-list"></div>
      <button id="save-group-details" type="button">Save Group Details</button>
      <button id="leave-group" type="button">Leave Group</button>
      <button id="save-members">Save Changes</button>
      <button id="close-settings">Cancel</button>
    </div>
    <div id="activity-popup" hidden>
      <div class="popup-box">
        <h3>Group Activity</h3>
        <div id="activity-list"></div>
        <button id="close-activity" type="button">Close</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/groupchat.js"></script>
</body>
</html>
