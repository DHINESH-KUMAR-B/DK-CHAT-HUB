<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DK chat hub</title>
  <link rel="icon" href="image/dklogo.png">
  <link rel="stylesheet" href="css/groups.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>
<body id="all">

  <h2 id="page-title">Groups</h2>
  <div id="groups-search"><i class="bi bi-search"></i><input id="group-search-input" type="search" placeholder="Search groups..." aria-label="Search groups"></div>
  <div id="recent-groups"></div>

  <!-- Groups List -->
  <div id="groups-list"></div>

  <!-- Floating Add Button -->
  <button id="add-group-btn">+</button>

  <!-- Popup Form -->
  <div id="group-popup">
    <div class="popup-box">
      <h3>Create Group</h3>
      <input type="text" id="group-name" placeholder="Group Name">

      <!-- Group DP Upload -->
      <label for="group-photo-input">Group Photo (Permanent DP):</label>
      <input type="file" id="group-photo-input" accept="image/*">
      <img id="group-photo-preview" src="image/group.png" alt="Preview">

      <!-- Members list -->
      <div id="members-list"></div>

      <button id="save-group">Create</button>
      <button id="close-popup">Cancel</button>
    </div>
  </div>

  <!-- Footer Navigation -->
  <div class="footnav">
    <a href="home.html" aria-label="Home"><i class="bi bi-house"></i></a>
    <a href="chat.html" aria-label="Chats"><i class="bi bi-chat"></i></a>
    <a href="group.html" aria-label="Groups"><i class="bi bi-people"></i></a>
    <a href="profile.html" aria-label="Profile"><i class="bi bi-person"></i></a>
  </div>

  <script type="module" src="js/group.js"></script>
</body>
</html>
