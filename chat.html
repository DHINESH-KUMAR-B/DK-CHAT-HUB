<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DK Chat Hub</title>
  <link rel="icon" href="image/dklogo.png">
  <link rel="stylesheet" href="css/chat.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>
<body id="all">
  <main class="chat-page">
    <header class="chat-header">
      <div><h1>Chats</h1><p id="chat-summary">Loading conversations...</p></div>
      <a href="friends.html" class="new-chat" aria-label="Start a new chat"><i class="bi bi-pencil-square"></i></a>
    </header>
    <label class="chat-search"><i class="bi bi-search"></i><input id="chat-search" type="search" placeholder="Search chats" aria-label="Search chats"></label>
    <div class="chat-tools">
      <button class="active" type="button" data-filter="all">All</button>
      <button type="button" data-filter="unread">Unread</button>
      <button type="button" data-filter="groups">Groups</button>
      <button type="button" data-filter="pinned">Pinned</button>
    </div>
    <section id="chat-list" aria-live="polite"><p class="chat-empty">Loading conversations...</p></section>
  </main>
  <nav class="footnav">
    <a href="home.html"><i class="bi bi-house"></i></a>
    <a href="chat.html" aria-current="page"><i class="bi bi-chat-fill"></i></a>
    <a href="group.html"><i class="bi bi-people"></i></a>
    <a href="profile.html"><i class="bi bi-person"></i></a>
  </nav>
  <script type="module" src="js/chat.js"></script>
</body>
</html>
