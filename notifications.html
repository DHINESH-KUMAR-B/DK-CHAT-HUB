<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - DK Chat Hub</title>
  <link rel="icon" href="image/dklogo.png">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/notifications.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>
<body id="all" class="notifications-page">
  <main class="notifications-main">
    <header class="notifications-topbar">
      <a href="home.html" aria-label="Back home"><i class="bi bi-arrow-left"></i></a>
      <h1><i class="bi bi-bell"></i> Notifications <span id="notification-count"></span></h1>
      <button id="mark-all" type="button">Mark all read</button>
    </header>
    <nav class="notification-filters" aria-label="Notification filters">
      <button class="active" type="button" data-filter="all">All</button>
      <button type="button" data-filter="unread">Unread</button>
    </nav>
    <section id="notifications-list" aria-live="polite"></section>
  </main>
  <div class="footnav">
    <a href="home.html"><i class="bi bi-house"></i></a>
    <a href="chat.html"><i class="bi bi-chat"></i></a>
    <a href="group.html"><i class="bi bi-people"></i></a>
    <a href="profile.html"><i class="bi bi-person"></i></a>
  </div>
  <script type="module" src="js/notifications-page.js"></script>
</body>
</html>
