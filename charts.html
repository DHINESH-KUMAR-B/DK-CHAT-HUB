<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DK chat hub</title>
  <link rel="icon" href="image/dklogo.png">
  <link rel="stylesheet" href="css/charts.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
<body id="all">

  <!-- Chat Header -->
  <div id="chat-header">
    <button id="back-btn" type="button" aria-label="Back">‹</button>
    <img id="friend-photo" src="image/profile.png" alt="Friend">
    <div>
      <div id="friend-name">Friend</div>
      <div id="friend-status">Last seen: ...</div>
    </div>
    <button id="search-btn" type="button" aria-label="Search messages">⌕</button>
  </div>

  <div id="search-bar" hidden>
    <input type="search" id="message-search" placeholder="Search messages...">
  </div>

  <!-- Chat Messages -->
  <div id="chat-box"></div>

  <!-- Typing Indicator -->
  <div id="typing-indicator"></div>

  <!-- Input Area -->
  <div id="chat-input-area">
    <button id="emoji-btn" type="button" aria-label="Add emoji">☺</button>
    <label id="image-btn" for="image-input" aria-label="Send image">＋</label>
    <input type="file" id="image-input" accept="image/*" hidden>
    <input type="text" id="chat-input" placeholder="Type a message...">
    <button id="send-btn">Send</button>
  </div>
  <div id="emoji-picker" hidden>
    <button type="button">😀</button><button type="button">😂</button><button type="button">😍</button>
    <button type="button">😎</button><button type="button">😢</button><button type="button">😡</button>
    <button type="button">👍</button><button type="button">❤️</button><button type="button">🎉</button>
    <button type="button">🙏</button><button type="button">👋</button>
  </div>

  <!-- Footer Navigation -->
  <div class="footnav">
    <a href="home.html" aria-label="Home"><i class="bi bi-house"></i></a>
    <a href="chat.html" aria-label="Chats"><i class="bi bi-chat"></i></a>
    <a href="group.html" aria-label="Groups"><i class="bi bi-people"></i></a>
    <a href="profile.html" aria-label="Profile"><i class="bi bi-person"></i></a>
  </div>

<script type="module" src="js/charts.js"></script>

</body>
</html>
